services:
  # ==================== MySQL Cluster ====================
  mysql-primary:
    image: mysql:8.0
    container_name: mes-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: mes
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:?MYSQL_REPLICATION_PASSWORD is required for HA}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql/primary/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-replica:
    image: mysql:8.0
    container_name: mes-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:?MYSQL_REPLICATION_PASSWORD is required for HA}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./mysql/replica/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      mysql-primary:
        condition: service_healthy
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis Sentinel ====================
  # 注意：所有 Redis 节点与哨兵共用同一个 REDIS_PASSWORD；
  # 由 shell 运行时拼入 conf，避免把明文密码写入挂载文件。
  redis-master:
    image: redis:7-alpine
    container_name: mes-redis-master
    # 仅对内部网络暴露；如需本地调试可临时打开 127.0.0.1:6379:6379
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required, generate a strong random value}
    volumes:
      - redis_master_data:/data
    networks:
      - mes-net
    command:
      - "sh"
      - "-c"
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy allkeys-lru'
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-slave-1:
    image: redis:7-alpine
    container_name: mes-redis-slave-1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - "sh"
      - "-c"
      - 'exec redis-server --replicaof redis-master 6379 --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"'
    volumes:
      - redis_slave1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-slave-2:
    image: redis:7-alpine
    container_name: mes-redis-slave-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - "sh"
      - "-c"
      - 'exec redis-server --replicaof redis-master 6379 --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"'
    volumes:
      - redis_slave2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # sentinel.conf 模板在容器启动时用环境变量 REDIS_PASSWORD 渲染到可写目录。
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-1
    ports:
      - "26379:26379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.template:ro
    command:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.template /tmp/sentinel.conf \
          && echo "sentinel auth-pass mes-redis-master $$REDIS_PASSWORD" >> /tmp/sentinel.conf \
          && exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-1:
        condition: service_healthy
    networks:
      - mes-net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.template:ro
    command:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.template /tmp/sentinel.conf \
          && echo "sentinel auth-pass mes-redis-master $$REDIS_PASSWORD" >> /tmp/sentinel.conf \
          && exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-1:
        condition: service_healthy
    networks:
      - mes-net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.template:ro
    command:
      - "sh"
      - "-c"
      - |
        cp /etc/redis/sentinel.template /tmp/sentinel.conf \
          && echo "sentinel auth-pass mes-redis-master $$REDIS_PASSWORD" >> /tmp/sentinel.conf \
          && exec redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-2:
        condition: service_healthy
    networks:
      - mes-net

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      RABBITMQ_DEFAULT_VHOST: mes
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mes-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql-primary
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_SERVICE_DB_NAME: nacos_config
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==================== Backend (Multi-Instance) ====================
  mes-backend-1:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
    container_name: mes-backend-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-primary:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      SPRING_DATA_REDIS_SENTINEL_MASTER: mes-redis-master
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      MES_JWT_SECRET: ${MES_JWT_SECRET:?MES_JWT_SECRET is required (>=32 random bytes)}
      SERVER_PORT: 9090
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mes-net

  mes-backend-2:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
    container_name: mes-backend-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-primary:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      SPRING_DATA_REDIS_SENTINEL_MASTER: mes-redis-master
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      MES_JWT_SECRET: ${MES_JWT_SECRET:?MES_JWT_SECRET is required (>=32 random bytes)}
      SERVER_PORT: 9090
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mes-net

  # ==================== Frontend (Nginx LB) ====================
  mes-frontend:
    build:
      context: ./mes-frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.ha.conf
    container_name: mes-frontend
    ports:
      - "80:80"
    depends_on:
      - mes-backend-1
      - mes-backend-2
    networks:
      - mes-net

  # ==================== Monitoring ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: mes-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mes-net

  grafana:
    image: grafana/grafana:latest
    container_name: mes-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required, avoid default admin123}
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mes-net

  # ==================== Exporters ====================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mes-mysql-exporter
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD:-12345678}@(mysql-primary:3306)/"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - mes-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mes-redis-exporter
    environment:
      REDIS_ADDR: redis-master:6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net

volumes:
  mysql_primary_data:
  mysql_replica_data:
  redis_master_data:
  redis_slave1_data:
  redis_slave2_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  uploads:

networks:
  mes-net:
    driver: bridge
