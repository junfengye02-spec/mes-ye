services:
  # ==================== MySQL Cluster ====================
  mysql-primary:
    image: mysql:8.0
    container_name: mes-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_DATABASE: mes
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql/primary/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql:/docker-entrypoint-initdb.d/schema
      - ./mysql/init:/docker-entrypoint-initdb.d/init
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-replica:
    image: mysql:8.0
    container_name: mes-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./mysql/replica/my.cnf:/etc/mysql/conf.d/my.cnf
    depends_on:
      mysql-primary:
        condition: service_healthy
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis Sentinel ====================
  redis-master:
    image: redis:7-alpine
    container_name: mes-redis-master
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-slave-1:
    image: redis:7-alpine
    container_name: mes-redis-slave-1
    command: redis-server --replicaof redis-master 6379
    volumes:
      - redis_slave1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-slave-2:
    image: redis:7-alpine
    container_name: mes-redis-slave-2
    command: redis-server --replicaof redis-master 6379
    volumes:
      - redis_slave2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-1
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-1:
        condition: service_healthy
    networks:
      - mes-net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-2
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-1:
        condition: service_healthy
    networks:
      - mes-net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: mes-redis-sentinel-3
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave-2:
        condition: service_healthy
    networks:
      - mes-net

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mes
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      RABBITMQ_DEFAULT_VHOST: mes
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: mes-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql-primary
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_SERVICE_DB_NAME: nacos_config
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "SecretKey0123456789SecretKey0123456789SecretKey0123456789"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==================== Backend (Multi-Instance) ====================
  mes-backend-1:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
    container_name: mes-backend-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-primary:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      SPRING_DATA_REDIS_SENTINEL_MASTER: mes-redis-master
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      SERVER_PORT: 9090
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mes-net

  mes-backend-2:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
    container_name: mes-backend-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-primary:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      SPRING_DATA_REDIS_SENTINEL_MASTER: mes-redis-master
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      SERVER_PORT: 9090
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mes-net

  # ==================== Frontend (Nginx LB) ====================
  mes-frontend:
    build:
      context: ./mes-frontend
      dockerfile: Dockerfile
    container_name: mes-frontend
    ports:
      - "80:80"
    depends_on:
      - mes-backend-1
      - mes-backend-2
    networks:
      - mes-net

  # ==================== Monitoring ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: mes-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mes-net

  grafana:
    image: grafana/grafana:latest
    container_name: mes-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mes-net

  # ==================== Exporters ====================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mes-mysql-exporter
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD:-12345678}@(mysql-primary:3306)/"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - mes-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mes-redis-exporter
    environment:
      REDIS_ADDR: redis-master:6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net

volumes:
  mysql_primary_data:
  mysql_replica_data:
  redis_master_data:
  redis_slave1_data:
  redis_slave2_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  uploads:

networks:
  mes-net:
    driver: bridge
