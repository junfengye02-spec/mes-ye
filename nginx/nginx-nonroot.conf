# ============================================================
#  nginx-nonroot.conf — M9-P3-13 nginx 主进程降权
#  ------------------------------------------------------------
#  用途：在 docker-compose.ha.yml 的 nginx-gateway-lb service 中
#  挂载到 /etc/nginx/nginx.conf，覆盖 alpine 默认主配置。
#
#  关键点：
#   1) 去掉顶层 `user nginx;`（容器已通过 user: "101:101" 降权）
#   2) pid 文件写 /tmp，避免非 root 无法写 /var/run
#   3) worker_processes auto，按 CPU 数自适应
#   4) include /etc/nginx/conf.d/*.conf 保持与官方一致，station 配置
#      仍从 gateway-lb.conf 生效
# ============================================================

# user 指令显式省略——容器 user 已降为 nginx(uid=101)

worker_processes  auto;
# M9-P3-13: /var/run 在非 root 下可能只读，改到 /tmp
pid               /tmp/nginx.pid;
# alpine 默认错误日志路径需要可写
error_log         /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # ---- 访问日志 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log          /var/log/nginx/access.log main;

    # ---- 临时文件路径（非 root 可写） ----
    client_body_temp_path   /tmp/client_body 1 2;
    proxy_temp_path         /tmp/proxy 1 2;
    fastcgi_temp_path       /tmp/fastcgi 1 2;
    uwsgi_temp_path         /tmp/uwsgi 1 2;
    scgi_temp_path          /tmp/scgi 1 2;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;

    include             /etc/nginx/conf.d/*.conf;
}
