## =======================================================================
## mes-gateway 集群前的负载均衡（P1-16 HA 改造）
## 负载策略：least_conn（最少活动连接，适合长连接 / 不均衡请求）
## 健康检查：开源 nginx 只支持被动检查（把打挂的后端标记为 unhealthy）
##           若使用 nginx-plus / tengine / openresty 可启用主动健康检查
## 失败剔除参数：max_fails=3 fail_timeout=30s
##   连续 3 次失败后在 30 秒内不再把流量分发给该副本
##
## ---- M9-P3-08 改造说明 ----
## gateway 返回的是 JSON API 响应，不是 HTML，因此 CSP 对它的业务意义弱；
## 但为了统一站点 A+ 评分以及防止中间人注入 HTML 劫持，同样带上 nonce-CSP
## 和其他安全头。使用 include 与 mes-frontend/csp-headers.inc 保持一致。
## =======================================================================
upstream mes_gateway_cluster {
    least_conn;

    server mes-gateway-1:8080 max_fails=3 fail_timeout=30s;
    server mes-gateway-2:8080 max_fails=3 fail_timeout=30s;

    # 开启长连接以减少 TCP 握手开销
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;

    ## M9-P3-08: 每请求 nonce（API 响应极少内联，但保持 CSP 指令一致）
    set $csp_nonce $request_id;

    ## 统一安全响应头（含 nonce CSP）
    include /etc/nginx/conf.d/csp-headers.inc;

    ## 本地健康检查，供 Docker / k8s / SLB 探活使用
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
    }

    ## 反向代理到 gateway 副本
    location / {
        proxy_pass http://mes_gateway_cluster;

        ## HTTP/1.1 + 关闭 Connection 头以配合 upstream keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        ## 透传客户端信息（gateway 内部限流/审计依赖）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        ## 超时/缓冲：长链路后端服务可适当加大
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  100m;

        ## 被动健康检查：upstream 报错 / 超时自动切下一台
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
