      SPRING_DATA_REDIS_HOST: redis-master
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
