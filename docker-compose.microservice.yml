  mes-query-service:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
      target: mes-query-service
    container_name: mes-query-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-primary:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      SPRING_DATA_REDIS_HOST: redis-master
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mes
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mes_rabbitmq_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: mes
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      MES_JWT_SECRET: ${MES_JWT_SECRET:?MES_JWT_SECRET is required (>=32 random bytes)}
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      TZ: Asia/Shanghai
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - mes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9007/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==================== API 网关 ====================
  mes-gateway:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
      target: mes-gateway
    container_name: mes-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_DATA_REDIS_HOST: redis-master
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MES_JWT_SECRET: ${MES_JWT_SECRET:?MES_JWT_SECRET is required (>=32 random bytes)}
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      mes-system-service:
        condition: service_started
    networks:
      - mes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==================== 前端 ====================
  mes-frontend:
    build:
      context: ./mes-frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.microservice.conf
    container_name: mes-frontend
    ports:
      - "80:80"
    depends_on:
      - mes-gateway
    networks:
      - mes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== 监控 ====================
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mes-mysql-exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
    command:
      - "--mysqld.address=mysql-primary:3306"
      - "--mysqld.username=root"
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - mes-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: mes-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis-master:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - mes-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mes-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus-microservice.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - mysql-exporter
      - redis-exporter
    networks:
      - mes-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mes-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required, avoid default admin123}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mes-net

volumes:
  mysql_primary_data:
  redis_master_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  uploads:

networks:
  mes-net:
    driver: bridge
