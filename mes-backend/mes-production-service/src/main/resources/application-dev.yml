spring:
  cloud:
    nacos:
      discovery:
        enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678

    druid:
      connection-init-sqls:
        - SET NAMES utf8mb4
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

logging:
  level:
    com.mes: debug
