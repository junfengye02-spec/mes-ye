spring:
  cloud:
    nacos:
      discovery:
        enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678

    druid:
      connection-init-sqls:
        - SET NAMES utf8mb4
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

logging:
  level:
    com.mes: debug

resilience4j:
  circuitbreaker:
    instances:
      apsCircuitBreaker:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      apsRetry:
        max-attempts: 3
        wait-duration: 5s
