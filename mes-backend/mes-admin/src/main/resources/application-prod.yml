# ==================== 生产环境配置 ====================

server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # P0-05 安全整改：移除弱密码 fallback，生产必须通过环境变量 SPRING_DATASOURCE_PASSWORD 强制注入
    password: ${SPRING_DATASOURCE_PASSWORD:}

    druid:
      initial-size: 20
      min-idle: 20
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  data:
    redis:
      database: 0
      timeout: 5000ms
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms

  cloud:
    nacos:
      discovery:
        # P1-16 HA 改造：server-addr 支持多节点地址（逗号分隔）
        # 单节点示例：nacos:8848
        # 集群示例：  nacos-1:8848,nacos-2:8848,nacos-3:8848
        # Nacos 客户端内置 failover 逻辑，首选节点不可用时自动切到下一个
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}

    # ================================================================
    # P2-26 Sentinel 生产环境配置
    # 生产通过 Nacos 配置中心下发规则（运营可在不发版情况下调参）
    # Nacos DataId 约定：
    #   mes-sentinel-flow.json        —— FlowRule 数组（JSON）
    #   mes-sentinel-param-flow.json  —— ParamFlowRule 数组（JSON）
    #   mes-sentinel-degrade.json     —— DegradeRule 数组（JSON）
    # ================================================================
    sentinel:
      enabled: ${MES_SENTINEL_ENABLED:true}
      # CommonFilter：生产环境按 URL 自动生成资源名时开启，自定义 @SentinelResource 不依赖它，默认关闭避免冲突
      filter:
        enabled: false
      eager: true
      transport:
        # Sentinel Dashboard 地址（可选，不起时用 /actuator/prometheus 指标替代）
        dashboard: ${SENTINEL_DASHBOARD_ADDR:}
        port: ${SENTINEL_CLIENT_PORT:8719}
      log:
        dir: ./logs/sentinel
      datasource:
        # Nacos 下发 FlowRule
        flow-nacos:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: ${SENTINEL_GROUP_ID:SENTINEL_GROUP}
            data-id: mes-sentinel-flow.json
            data-type: json
            rule-type: flow
        # Nacos 下发 ParamFlowRule（热点参数限流）
        param-flow-nacos:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: ${SENTINEL_GROUP_ID:SENTINEL_GROUP}
            data-id: mes-sentinel-param-flow.json
            data-type: json
            rule-type: param-flow
        # Nacos 下发 DegradeRule（熔断）
        degrade-nacos:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: ${SENTINEL_GROUP_ID:SENTINEL_GROUP}
            data-id: mes-sentinel-degrade.json
            data-type: json
            rule-type: degrade

  rabbitmq:
    # ================================================================
    # P1-16 HA 改造：RabbitMQ 多节点 addresses + 连接缓存 + 重试
    # 优先使用 addresses 而非单机 host/port；一旦设置 addresses，
    # Spring AMQP 会忽略 host/port，转而按逗号分隔列表依次尝试。
    # 单机示例：rabbitmq:5672
    # 集群示例：rabbitmq-1:5672,rabbitmq-2:5672,rabbitmq-3:5672
    # ================================================================
    addresses: ${SPRING_RABBITMQ_ADDRESSES:}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:mes}
    # P0-05 安全整改：移除弱密码 fallback，生产必须通过环境变量 SPRING_RABBITMQ_PASSWORD 强制注入
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:mes}
    publisher-confirm-type: correlated
    publisher-returns: true
    # 连接缓存模式：CHANNEL（默认，每连接上复用 Channel）
    # HA 集群下不要切到 CONNECTION，会导致每次拿连接都可能落到不同节点、耗尽 TCP 资源
    cache:
      channel:
        size: 50
        checkout-timeout: 5000
      connection:
        mode: CHANNEL
    # 连接级自动重连与超时
    connection-timeout: 5000
    requested-heartbeat: 30
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 5
        max-concurrency: 20
        retry:
          # P1-16：消费侧重试打开，生产者侧重试见下方 template.retry
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
    # 生产者侧重试：单节点故障时客户端自动重试到下一个 addresses 节点
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        max-interval: 10000
        multiplier: 2.0

# 生产环境关闭 SQL 日志
logging:
  level:
    com.mes: info
    com.mes.framework: warn
  file:
    name: ./logs/mes-backend.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# 生产环境关闭 Swagger
springdoc:
  api-docs:
    enabled: false

knife4j:
  enable: false
  production: true

# 生产环境关闭 MyBatis SQL 打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Actuator 监控 + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 限流配置
mes:
  rate-limit:
    enabled: true
    default-qps: 100
    window-seconds: 1
  # P2-26 Sentinel 限流熔断
  sentinel:
    enabled: ${MES_SENTINEL_ENABLED:true}
