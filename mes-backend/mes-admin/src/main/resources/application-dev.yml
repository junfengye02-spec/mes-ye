# ==================== 开发环境配置 ====================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mes?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678

    # Druid 连接池
    druid:
      connection-init-sqls:
        - SET NAMES utf8mb4
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      filter:
        stat:
          slow-sql-millis: 1000
          log-slow-sql: true

# Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# 开发环境开启 SQL 日志
logging:
  level:
    com.mes: debug
    com.mes.**.mapper: debug

# APS 集成配置（开发环境）
# 实际运行时配置从 mes_aps_sync_config 表读取
# 此处仅作为启动时的 Resilience4j 框架默认值
resilience4j:
  circuitbreaker:
    instances:
      apsCircuitBreaker:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      apsRetry:
        max-attempts: 3
        wait-duration: 5s
