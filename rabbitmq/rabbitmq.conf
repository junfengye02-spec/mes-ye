# ============================================================
#  rabbitmq.conf — M9 P3-11 Quorum Queue 迁移
#  --------------------------------------------
#  与 definitions.json 配合使用：
#    - definitions.json 负责声明 policies（ha-classic-only / quorum-defaults）
#    - 本文件负责节点级开关与调优
#
#  注意：feature_flags 在 RabbitMQ 3.13 默认已全部启用（quorum_queue /
#  stream_queue / implicit_default_bindings 等）。这里**显式**再写一份
#  仅为日后升级到 4.x 时的可读性与灰度可控性。
# ============================================================

## ---- Queue 默认类型 ----
## 若客户端未显式声明 x-queue-type，则默认 quorum（除非使用 temporary queue）
## 这是 3.11+ 才支持的设置，老客户端兼容不变
default_queue_type = quorum

## ---- 集群分区恢复策略 ----
## autoheal 适合 3 节点：多数派继续提供服务，少数派重启后自动合并
## pause_minority 更保守（少数派停写），用于严格要求一致性场景
cluster_partition_handling = autoheal

## ---- Quorum 调优 ----
## 每条消息的最大重投递次数（通过 policy 覆盖更灵活，definitions.json 已配置 20）
## quorum_commands_soft_limit 控制 Raft 批量提交软上限
quorum_commands_soft_limit = 32

## ---- 磁盘/内存水位 ----
## 达到内存 40% 时触发 flow 控制，避免 OOM
vm_memory_high_watermark.relative = 0.4
## 磁盘剩余 2GB 触发磁盘告警
disk_free_limit.absolute = 2GB

## ---- 日志 ----
log.console = true
log.console.level = info
log.file = false

## ---- 网络 ----
## 心跳 60s，单侧 120s 无心跳即判定掉线，比默认 60s 更快检测网络分区
heartbeat = 60
## 连接数上限（生产环境按实际容量调）
## connection_max = 2000

## ---- Prometheus exporter ----
## 单独端口暴露 metrics，不要和 AMQP 端口复用
prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = false
