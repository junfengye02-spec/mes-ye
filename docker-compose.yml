services:
  mysql:
    image: mysql:8.0
    container_name: mes-mysql
    environment:
      # 生产必须通过环境变量/密钥管理注入强密码；若未设置将启动失败
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: mes
      TZ: Asia/Shanghai
    ports:
      # 避免与宿主机已占用的 3306 冲突；容器内仍为 3306，mes-backend 走服务名 mysql 不变
      - "${MES_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 360s

  redis:
    image: redis:7-alpine
    container_name: mes-redis
    # 生产上建议仅对后端服务暴露；本文件保留映射便于本地调试，但要求必须设置 REDIS_PASSWORD
    ports:
      - "127.0.0.1:${MES_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mes-net
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required, generate a strong random value}"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  # MinIO 对象存储（开发/演示用的单节点版；生产请使用 MinIO 集群或云 OSS）
  # 通过设置 mes.file.storage-type=minio 让应用切到 MinIO 实现
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: mes-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (>=8 chars)}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MES_MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MES_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mes-backend:
    build:
      context: ./mes-backend
      dockerfile: Dockerfile
    container_name: mes-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MES_JWT_SECRET: ${MES_JWT_SECRET:?MES_JWT_SECRET is required (>=32 random bytes)}
      MES_APS_API_KEY: ${MES_APS_API_KEY:?MES_APS_API_KEY is required}
      MES_APS_HMAC_KEY: ${MES_APS_HMAC_KEY:?MES_APS_HMAC_KEY is required (>=32 random bytes)}
      # 文件存储：生产默认使用 minio；本地开发如需单机磁盘可显式 MES_FILE_STORAGE_TYPE=local
      MES_FILE_STORAGE_TYPE: ${MES_FILE_STORAGE_TYPE:-minio}
      MES_FILE_MINIO_ENDPOINT: ${MES_FILE_MINIO_ENDPOINT:-http://minio:9000}
      MES_FILE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MES_FILE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MES_FILE_MINIO_BUCKET: ${MES_FILE_MINIO_BUCKET:-mes}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MES_BACKEND_HOST_PORT:-9090}:9090"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - mes-net

  mes-frontend:
    build:
      context: ./mes-frontend
      dockerfile: Dockerfile
    container_name: mes-frontend
    # M9-P3-13: 主进程非 root，容器内 listen 8080；host 继续暴露 80 对客户端无感
    ports:
      - "${MES_FRONTEND_HOST_PORT:-80}:8080"
    depends_on:
      mes-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - mes-net

volumes:
  mysql_data:
  redis_data:
  uploads:
  minio_data:

networks:
  mes-net:
    driver: bridge
