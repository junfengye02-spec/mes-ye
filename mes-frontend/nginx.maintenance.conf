# ============================================================
#  nginx.maintenance.conf
#  ------------------------------------------------------------
#  目的：M8 升级窗口（或任何计划内停机）把前端流量切到"维护页"，
#  同时对任何 /api/ 请求返回 503 + Retry-After，让客户端 / APP
#  知道这是可恢复的 planned outage 而不是永久故障。
#
#  使用方法：
#    1. 本文件已被 mes-frontend/Dockerfile 打包到
#       /etc/nginx/conf.d/nginx.maintenance.conf（image build 时 COPY）。
#    2. 升级开始时（Runbook §2.1）：
#         docker exec mes-frontend cp \
#             /etc/nginx/conf.d/nginx.maintenance.conf \
#             /etc/nginx/conf.d/default.conf
#         docker exec mes-frontend nginx -s reload
#    3. 升级结束时（Runbook §2.13）恢复 nginx.ha.conf（image 内 /etc/nginx/conf.d/nginx.ha.conf）：
#         docker exec mes-frontend cp \
#             /etc/nginx/conf.d/nginx.ha.conf \
#             /etc/nginx/conf.d/default.conf
#         docker exec mes-frontend nginx -s reload
#
#  替代做法：
#    直接 `docker compose stop mes-frontend`，让前置 LB / SLB 拿到
#    连接失败信号；但这会对接入层告警产生噪声，推荐用本 conf。
#
#  ---- M9-P3-08 改造说明 ----
#  维护页包含内联 <style>，必须给它一个每请求 nonce，才能在启用
#  nonce-based CSP 的环境下被浏览器解析（不会触发 CSP violation）。
#  通过 set $csp_nonce $request_id + nginx return 里直接插值实现。
# ============================================================

server {
    # M9-P3-13: nginx 主进程非 root（USER 10001），listen 非特权端口 8080
    listen 8080;
    server_name localhost;

    # 每请求 nonce；503 页面里的 <style> 会直接嵌入
    set $csp_nonce $request_id;

    # 统一安全响应头（含 nonce CSP），共用 include 保持三份 conf 一致
    include /etc/nginx/conf.d/csp-headers.inc;

    # ==================== 健康检查（内部 LB 继续探活） ====================
    # 升级窗口内 LB 仍应能 probe，避免被摘除导致切流量更复杂
    location = /health {
        access_log off;
        return 200 "maintenance\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==================== API 请求：503 + Retry-After（关键行为） ====================
    # 这是 Runbook §2.1 / §2.13 的语义锚点：任何到达 /api/ 的请求都被明确拒绝，
    # 并用 Retry-After 指示客户端"90 分钟后再重试"（M8 规划窗口 T0 → T+90min）
    # location 内出现 add_header 会丢弃父级全部安全头，故再 include 一次
    location /api/ {
        include /etc/nginx/conf.d/csp-headers.inc;
        add_header Retry-After "5400" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":503,"msg":"MES 正在维护升级（planned maintenance），请稍后重试","data":null,"retryAfter":5400}';
    }

    # ==================== 所有其它请求：返回内联维护页 ====================
    # 不读磁盘 / 不依赖 dist/，避免前端构建未完成时"维护页本身也坏"
    # 若需 503 文案更丰富，可以把下面的 HTML 抽成 /usr/share/nginx/html/maintenance.html
    # 并 try_files 兜底；本 inline 版保证最小依赖。
    # <style nonce="$csp_nonce"> 会在 nginx 返回时被直接插值，与响应头的 CSP
    # 'nonce-$csp_nonce' 对应，从而通过 CSP 校验。
    location / {
        default_type text/html;
        return 503 '<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csp-nonce" content="$csp_nonce">
  <title>MES 系统维护中</title>
  <style nonce="$csp_nonce">
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f1419; color:#e6e6e6; text-align:center; padding:24px; }
    .wrap { max-width:520px; }
    h1 { font-size:42px; color:#4fc3f7; margin-bottom:16px; letter-spacing:2px; }
    p { font-size:15px; line-height:1.7; color:#c7c7c7; margin:8px 0; }
    .eta { margin-top:24px; padding:12px 16px; background:#1a2028; border-radius:6px; font-size:13px; color:#9ad8ff; }
    a { color:#4fc3f7; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MES</h1>
    <p>我们正在进行计划内升级维护（M8）。</p>
    <p>此次维护预计 90 分钟，期间所有接口请求会收到 HTTP 503。</p>
    <p>如有紧急业务需要，请联系运维 on-call。</p>
    <div class="eta">本系统将在 90 分钟内恢复。状态更新请关注企业钉钉群 <strong>MES-M8-UPGRADE-War-Room</strong>。</div>
  </div>
</body>
</html>';
    }
}
