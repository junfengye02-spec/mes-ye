upstream mes_backend {
    server mes-backend:9090;
    keepalive 32;
}

server {
    # M9-P3-13: nginx 主进程非 root（USER 10001），listen 非特权端口 8080；host 继续暴露 80 对客户端无感
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==================== M9-P3-08: nonce-based CSP ====================
    # 每请求一个随机 nonce（$request_id 是 nginx 内置的 16 字节随机 hex）
    set $csp_nonce $request_id;

    # index.html 里的 __CSP_NONCE__ 占位会被替换成当前请求的 $csp_nonce
    # sub_filter_once off  —— 允许一个响应体内多次替换（meta + script + style）
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' '$csp_nonce';

    # 统一安全响应头（X-Frame-Options / HSTS / nonce-CSP 等）
    include /etc/nginx/conf.d/csp-headers.inc;

    # ==================== 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # Brotli：依赖 nginx 构建时带 ngx_brotli；若镜像未含该模块，这些指令会被注释或忽略
    # 推荐构建阶段使用 vite-plugin-compression 预生成 .br 文件，再开启 brotli_static on
    # 注意：对 text/html 关闭 brotli_static，否则 sub_filter 替换 __CSP_NONCE__ 会被 .br 预压缩文件绕过
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ==================== 健康检查 ====================
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==================== 静态资源 ====================
    # index.html 不缓存，避免前端发版后旧页面继续加载旧 hash 资源
    # add_header 一旦在 location 出现，父级 add_header 全部失效，
    # 必须 include 一次把安全头/CSP 重新补回来
    location = /index.html {
        include /etc/nginx/conf.d/csp-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://mes_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        client_max_body_size 100m;
    }

    # 静态资源缓存：同样需要 include 安全头，否则 CSP 被丢
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/conf.d/csp-headers.inc;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
