upstream mes_backend {
    server mes-backend-1:9090;
    server mes-backend-2:9090;
    keepalive 32;
}

server {
    # M9-P3-13: nginx 主进程非 root（USER 10001），listen 非特权端口 8080
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==================== M9-P3-08: nonce-based CSP ====================
    set $csp_nonce $request_id;

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' '$csp_nonce';

    include /etc/nginx/conf.d/csp-headers.inc;

    # ==================== 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # text/html 不进 brotli_static，sub_filter 才能替换 __CSP_NONCE__
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ==================== 健康检查 ====================
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==================== 静态资源 ====================
    location = /index.html {
        include /etc/nginx/conf.d/csp-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://mes_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        client_max_body_size 100m;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/conf.d/csp-headers.inc;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
